spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ai_workflow?useSSL=true&characterEncoding=utf8mb4
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

audio:
  synthesis:
    provider: real
    api-url: ${TTS_API_URL}
    api-key: ${TTS_API_KEY}
